name: Build Android App (Play Store AAB & APK)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches: [main, master]
    paths:
      - 'collage-management-app/mobile-app/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: collage-management-app/mobile-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        working-directory: collage-management-app/mobile-app
        run: npm ci

      - name: Build Android App Bundle (.aab for Play Store)
        working-directory: collage-management-app/mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Build Android APK (for direct device install)
        working-directory: collage-management-app/mobile-app/android
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: CMS-Academy-Portal-PlayStore-AAB
          path: collage-management-app/mobile-app/android/app/build/outputs/bundle/release/*.aab

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CMS-Academy-Portal-Release-APK
          path: collage-management-app/mobile-app/android/app/build/outputs/apk/release/*.apk

